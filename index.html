<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist Roulette Pro: Ultimate Control 📱🎰</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0d0f14;
            --panel: #161a21;
            --accent: #d4a373;
            --text-main: #e6edf3;
            --win: #2a9d8f;
            --bonus: #ec4899;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Layout Responsivo --- */
        .sidebar {
            width: 320px;
            background: var(--panel);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d3139;
            transition: 0.3s;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: radial-gradient(circle at center, #1c2128 0%, #0d0f14 100%);
            overflow-y: auto;
            padding: 30px 10px;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #2d3139; padding: 10px 20px; box-sizing: border-box; }
            .sidebar h2 { cursor: pointer; display: flex; justify-content: space-between; margin: 5px 0; font-size: 0.9rem; }
            .sidebar .scroll-area { display: none; max-height: 300px; }
            .sidebar.active .scroll-area { display: block; }
            .wheel-box { width: 90vw !important; height: 90vw !important; }
            .main-content { padding: 20px 0; }
        }

        .scroll-area { flex: 1; overflow-y: auto; padding-right: 5px; }

        .item-card {
            background: #1c2128; padding: 12px; border-radius: 12px; margin-bottom: 10px;
            position: relative; border-left: 5px solid #444;
        }

        .tier-tag { font-size: 0.6rem; text-transform: uppercase; font-weight: 800; padding: 2px 8px; border-radius: 4px; margin-bottom: 5px; display: inline-block; color: #fff; }
        .prob-val { position: absolute; right: 12px; bottom: 12px; font-weight: 800; color: var(--accent); font-size: 0.85rem; }

        /* --- Ruleta --- */
        .wheel-box { position: relative; width: 480px; height: 480px; flex-shrink: 0; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 5px solid #2d3139; }
        .pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); z-index: 50; }

        /* --- MINIJUEGO CAJAS --- */
        .bonus-container { width: 90%; max-width: 600px; display: none; flex-direction: column; align-items: center; background: rgba(236, 72, 153, 0.05); padding: 25px; border-radius: 25px; border: 2px dashed var(--bonus); margin: 30px 0; }
        .gifts-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .gift-box { width: 80px; height: 80px; background: var(--bonus); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: 0.3s; position: relative; }
        .gift-box.open { background: #1c2128; border: 2px solid var(--bonus); }
        .gift-content { font-size: 0.6rem; text-align: center; font-weight: bold; display: none; padding: 2px; }
        .gift-box.open .gift-content { display: block; }
        .gift-box.open .gift-icon { display: none; }

        /* --- UI --- */
        .points-panel { background: #11141a; border: 2px solid var(--accent); padding: 10px 30px; border-radius: 25px; margin-bottom: 20px; text-align: center; }
        .points-val { background: transparent; border: none; border-bottom: 2px solid var(--accent); color: var(--accent); font-size: 1.8rem; width: 70px; text-align: center; font-weight: 900; outline: none; }
        
        .btn-spin { margin-top: 15px; padding: 15px 40px; background: var(--accent); color: #111; font-weight: 900; border: none; border-radius: 50px; cursor: pointer; width: 280px; box-shadow: 0 6px 0 #9b724b; }
        .btn-toggle { background: transparent; color: var(--bonus); border: 2px solid var(--bonus); padding: 8px 20px; margin-top: 80px; font-size: 0.7rem; border-radius: 50px; cursor: pointer; }

        /* --- Settings Panel Refinado --- */
        .settings-side { position: fixed; right: -450px; top: 0; width: 90%; max-width: 400px; height: 100%; background: #11141a; padding: 25px; z-index: 300; transition: 0.4s; border-left: 2px solid var(--accent); overflow-y: auto; }
        .settings-side.open { right: 0; }
        
        .json-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; margin-top: 15px; }
        .json-controls { display: flex; gap: 8px; }
        .control-btn { background: #2d3139; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; gap: 4px; }
        .control-btn:hover { background: #3d424d; }
        .control-btn.danger:hover { background: #9b2226; }

        textarea { width: 100%; background: #000; color: #8fb339; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 10px; border-radius: 8px; box-sizing: border-box; }

        /* --- Modal --- */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 30px; border-radius: 30px; z-index: 400; text-align: center; border: 2px solid var(--accent); width: 85%; max-width: 350px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 399; }
        .modal-btn { background: var(--accent); color: #111; padding: 12px 50px; border: none; border-radius: 12px; font-weight: 900; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidePending">
        <h2 onclick="toggleSidebar('sidePending')">⏳ PENDIENTES <i data-lucide="chevron-down"></i></h2>
        <div class="scroll-area" id="pendingList"></div>
    </div>

    <div class="main-content">
        <div class="points-panel">
            <div style="font-size: 0.6rem; letter-spacing: 2px; color: var(--accent);">PUNTOS ACUMULADOS</div>
            <input type="number" id="currentPoints" value="5" step="5" min="0" class="points-val" onchange="loadData()">
            <div id="luckMsg" style="font-size: 0.7rem; font-weight: bold; margin-top: 5px;"></div>
        </div>

        <div class="wheel-box">
            <div class="pointer"><svg width="40" height="50"><path d="M20 50 L40 10 L0 10 Z" fill="#d4a373" stroke="#000" stroke-width="2"/></svg></div>
            <canvas id="canvas" width="800" height="800"></canvas>
            <button id="spinBtn" class="btn-spin" onclick="spin()" style="position: absolute; bottom: -80px; left: 50%; transform: translateX(-50%);">GIRAR RULETA</button>
        </div>

        <button id="toggleBonusBtn" class="btn-toggle" onclick="toggleBonus()">✨ REVELAR REGALOS MISTERIOSOS ✨</button>

        <div id="bonusSection" class="bonus-container">
            <h3 style="color: var(--bonus); margin: 0; letter-spacing: 2px;">MAGIC GIFT BOXES</h3>
            <p style="font-size: 0.7rem; opacity: 0.7; margin-bottom: 10px;">Dificultad adaptada. ¡Suerte!</p>
            <div class="gifts-grid" id="giftsGrid"></div>
        </div>
    </div>

    <div class="sidebar" id="sideWon" style="border-left: 1px solid #2d3139; border-right: none;">
        <h2 onclick="toggleSidebar('sideWon')">🏆 GANADOS <i data-lucide="chevron-down"></i></h2>
        <div class="scroll-area" id="wonList"></div>
    </div>

    <button style="position:fixed; top:20px; right:20px; z-index:310; background:rgba(0,0,0,0.5); border:1px solid var(--accent); color:var(--accent); cursor:pointer; padding: 8px; border-radius: 50%;" onclick="document.getElementById('setPanel').classList.toggle('open')">
        <i data-lucide="settings"></i>
    </button>

    <div class="settings-side" id="setPanel">
        <h3 style="color:var(--accent); margin-top:0">Ajustes Maestro</h3>
        
        <div class="json-header">
            <label style="font-size: 0.7rem">1. Wishlist (JSON)</label>
            <div class="json-controls">
                <button class="control-btn" onclick="copyText('jsonWish')"><i data-lucide="copy" style="width:12px"></i></button>
                <button class="control-btn danger" onclick="clearText('jsonWish')"><i data-lucide="trash-2" style="width:12px"></i></button>
            </div>
        </div>
        <textarea id="jsonWish" style="height:200px"></textarea>

        <div class="json-header">
            <label style="font-size: 0.7rem">2. Niveles (JSON)</label>
            <div class="json-controls">
                <button class="control-btn" onclick="copyText('jsonTiers')"><i data-lucide="copy" style="width:12px"></i></button>
                <button class="control-btn danger" onclick="clearText('jsonTiers')"><i data-lucide="trash-2" style="width:12px"></i></button>
            </div>
        </div>
        <textarea id="jsonTiers" style="height:120px">[
  {"level": 1, "name": "Nivel 1", "min": 1, "max": 50, "weight": 84},
  {"level": 2, "name": "Nivel 2", "min": 51, "max": 100, "weight": 7},
  {"level": 3, "name": "Nivel 3", "min": 101, "max": 150, "weight": 5},
  {"level": 4, "name": "Nivel 4", "min": 151, "max": 250, "weight": 3},
  {"level": 5, "name": "Nivel 5", "min": 251, "max": 9999, "weight": 1}
]</textarea>
        
        <label style="font-size: 0.7rem; display:block; margin-top:15px">Siga Participando (%)</label>
        <input type="number" id="sigaP" value="1" style="width:100%; margin-bottom:15px; background:#000; color:#fff; border:1px solid #333; padding: 10px; border-radius: 8px;">
        
        <button onclick="loadData()" style="width:100%; padding:14px; background:var(--win); border:none; color:white; border-radius:8px; font-weight:bold; cursor:pointer;">APLICAR CAMBIOS</button>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalRes" style="margin:0; color:var(--accent); text-transform: uppercase;"></h3>
            <h1 id="winnerName" style="margin:15px 0; font-size: 1.5rem;"></h1>
            <button onclick="closeModal()" class="modal-btn">ACEPTAR</button>
        </div>
    </div>

    <script>
        // Funciones de control añadidas
        function copyText(id) {
            const text = document.getElementById(id).value;
            navigator.clipboard.writeText(text);
            alert("Contenido copiado.");
        }

        function clearText(id) {
            if(confirm("¿Seguro que quieres limpiar este campo?")) {
                document.getElementById(id).value = "";
            }
        }

        const initialWish = [
  {
    "NumeroItem": 1,
    "NombreItem": "Calcetines Yoga Antideslizantes Diu Life",
    "PrecioItem": 0,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 2,
    "NombreItem": "Brochas Maquillaje Viaje Blavvennt",
    "PrecioItem": 0,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 3,
    "NombreItem": "Gua Sha Cuarzo Rosa PLANTIFIQUE",
    "PrecioItem": 0,
    "Estado": "ganado"
  },
  {
    "NumeroItem": 4,
    "NombreItem": "Rodillo de Hielo Facial Fronnor",
    "PrecioItem": 0,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 5,
    "NombreItem": "Secador de Pelo Laifen Swift",
    "PrecioItem": 169.99,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 6,
    "NombreItem": "Depiladora IPL INNZA",
    "PrecioItem": 89.99,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 7,
    "NombreItem": "Short Deportivo 2 en 1 CADMUS",
    "PrecioItem": 39.99,
    "Estado": "ganado"
  },
  {
    "NumeroItem": 8,
    "NombreItem": "Sujetador Deportivo Running Girl",
    "PrecioItem": 23.99,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 9,
    "NombreItem": "Corrector Westman Atelier",
    "PrecioItem": 66.73,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 10,
    "NombreItem": "Exfoliante Facial GUGUG",
    "PrecioItem": 19.99,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 11,
    "NombreItem": "Limpiador Facial BeautyBio GLOfacial",
    "PrecioItem": 249.00,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 12,
    "NombreItem": "Máquina Terapia Facial NuDerma",
    "PrecioItem": 79.95,
    "Estado": "pendiente"
  },
  {
    "NumeroItem": 13,
    "NombreItem": "Bolso Cruzado VONCOSS",
    "PrecioItem": 25.99,
    "Estado": "ganado"
  }
];
        document.getElementById('jsonWish').value = JSON.stringify(initialWish, null, 2);

        let wishlist = [], tiers = [], activeItems = [], bonusPool = [];
        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
        let currentRotation = 0, isSpinning = false, bonusActive = false;

        function toggleSidebar(id) {
            if (window.innerWidth <= 900) {
                document.getElementById(id).classList.toggle('active');
            }
        }

        function getLevelColor(level) {
            const colors = { 1: "#457b9d", 2: "#81b29a", 3: "#f2cc8f", 4: "#f4a261", 5: "#e76f51" };
            return colors[level] || "#333";
        }

        function toggleBonus() {
            const sec = document.getElementById('bonusSection');
            bonusActive = (sec.style.display === 'none' || sec.style.display === '');
            sec.style.display = bonusActive ? 'flex' : 'none';
            document.getElementById('toggleBonusBtn').innerText = bonusActive ? '❌ CERRAR REGALOS' : '✨ REVELAR REGALOS MISTERIOSOS ✨';
            if(bonusActive) setupMagicBoxes();
        }

        function loadData() {
            try {
                wishlist = JSON.parse(document.getElementById('jsonWish').value);
                tiers = JSON.parse(document.getElementById('jsonTiers').value);
                const pts = parseInt(document.getElementById('currentPoints').value);
                const pSiga = parseInt(document.getElementById('sigaP').value) / 100;

                const pending = wishlist.filter(i => i.PrecioItem > 0 && i.Estado === 'pendiente').map(i => {
                    const tier = tiers.find(t => i.PrecioItem >= t.min && i.PrecioItem <= t.max) || tiers[0];
                    return { ...i, type: 'prize', tier: tier, color: getLevelColor(tier.level) };
                });

                const progress = Math.min(Math.max((pts - 5) / 15, 0), 1);
                const currentWeights = {};
                tiers.forEach(t => {
                    const mirror = tiers.find(mt => mt.level === (6 - t.level)) || t;
                    currentWeights[t.level] = (t.weight * (1 - progress)) + (mirror.weight * progress);
                });

                const tiersInPlay = [...new Set(pending.map(p => p.tier.level))];
                let totalW = 0;
                tiersInPlay.forEach(l => totalW += currentWeights[l]);

                const pAvailable = 1 - (pending.length > 0 ? pSiga : 0);
                activeItems = pending.map(item => {
                    const tProb = (currentWeights[item.tier.level] / totalW) * pAvailable;
                    const count = pending.filter(p => p.tier.level === item.tier.level).length;
                    return { ...item, prob: tProb / count };
                });
                if (activeItems.length > 0) activeItems.push({ NombreItem: "☘️ Reintentar", type: 'siga', prob: pSiga });

                renderUI();
                drawWheel();
                if(bonusActive) setupMagicBoxes();
            } catch (e) { console.error(e); }
        }

        function setupMagicBoxes() {
            const grid = document.getElementById('giftsGrid');
            grid.innerHTML = "";
            const pendientes = wishlist.filter(i => i.PrecioItem <= 0 && i.Estado === 'pendiente');
            if(pendientes.length === 0) { grid.innerHTML = "<p>Sin regalos.</p>"; return; }

            const numSigas = Math.max(1, Math.floor(pendientes.length / 2));
            bonusPool = [...pendientes.map(p => ({...p, isWin: true}))];
            for(let i=0; i<numSigas; i++) bonusPool.push({ NombreItem: "Siga Participando", isWin: false });
            bonusPool.sort(() => Math.random() - 0.5);

            bonusPool.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = 'gift-box';
                box.innerHTML = `<span class="gift-icon">🎁</span><div class="gift-content">${item.NombreItem}</div>`;
                box.onclick = () => revealGift(index, box);
                grid.appendChild(box);
            });
        }

        function revealGift(idx, box) {
            if(box.classList.contains('open')) return;
            const item = bonusPool[idx];
            document.querySelectorAll('.gift-box').forEach((b, i) => {
                b.classList.add('open');
                if(i === idx) b.style.borderColor = "var(--accent)";
            });

            setTimeout(() => {
                if(item.isWin) {
                    const master = wishlist.find(x => x.NumeroItem === item.NumeroItem);
                    if(master) master.Estado = 'ganado';
                    confetti({ particleCount: 200, spread: 100 });
                    document.getElementById('modalRes').innerText = "¡PREMIO OBTENIDO!";
                } else { document.getElementById('modalRes').innerText = "VACIÓ"; }
                document.getElementById('winnerName').innerText = item.NombreItem;
                document.getElementById('modal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
                renderUI();
            }, 600);
        }

        function renderUI() {
            const pList = document.getElementById('pendingList'), wList = document.getElementById('wonList');
            pList.innerHTML = ""; wList.innerHTML = "";

            const sorted = activeItems.filter(i => i.type === 'prize').sort((a,b) => b.prob - a.prob);
            sorted.forEach(i => {
                pList.innerHTML += `<div class="item-card" style="border-left-color:${i.color}">
                    <span class="tier-tag" style="background:${i.color}">${i.tier.name}</span>
                    <span class="prob-val">${(i.prob*100).toFixed(1)}%</span>
                    <b>${i.NombreItem}</b><br><small>$${i.PrecioItem}</small></div>`;
            });
            wishlist.filter(i => i.PrecioItem <= 0 && i.Estado === 'pendiente').forEach(i => {
                pList.innerHTML += `<div class="item-card" style="border-left-color:var(--bonus)">
                    <span class="tier-tag" style="background:var(--bonus)">BONUS</span>
                    <b>${i.NombreItem}</b></div>`;
            });
            wishlist.filter(i => i.Estado === 'ganado').forEach(i => {
                const tier = tiers.find(t => i.PrecioItem >= t.min && i.PrecioItem <= t.max);
                const color = i.PrecioItem <= 0 ? 'var(--bonus)' : (tier ? getLevelColor(tier.level) : "#444");
                wList.innerHTML += `<div class="item-card" style="border-left-color:${color}; opacity:0.6">
                    <b>${i.NombreItem}</b><br><small>GANADO ✅</small></div>`;
            });
            document.getElementById('jsonWish').value = JSON.stringify(wishlist, null, 2);
        }

        function drawWheel() {
            const cx = canvas.width/2, cy = canvas.height/2, r = canvas.width/2 - 30;
            let start = 0; ctx.clearRect(0,0,canvas.width,canvas.height);
            activeItems.forEach(item => {
                const slice = item.prob * 2 * Math.PI;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, start + slice);
                ctx.fillStyle = item.type === 'siga' ? '#0d1117' : item.color;
                ctx.fill(); ctx.stroke();
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(start + slice/2);
                ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 16px Inter";
                ctx.fillText(item.NombreItem.substring(0,18), r - 40, 6); ctx.restore();
                start += slice;
            });
        }

        function spin() {
            if (isSpinning || activeItems.length === 0) return;
            const ptsIn = document.getElementById('currentPoints');
            if (parseInt(ptsIn.value) < 5) return;
            const itemsSnapshot = [...activeItems]; 
            isSpinning = true; document.getElementById('spinBtn').disabled = true;
            ptsIn.value = 0; 
            const duration = 6000, extra = 15 + Math.random()*5, totalRot = extra*2*Math.PI, startT = performance.now();
            function anim(now) {
                const elapsed = now - startT;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 5);
                const rot = currentRotation + (totalRot * ease);
                ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.rotate(rot);
                ctx.translate(-canvas.width/2, -canvas.height/2);
                let tempStart = 0;
                itemsSnapshot.forEach(item => {
                    const slice = item.prob * 2 * Math.PI;
                    ctx.beginPath(); ctx.moveTo(canvas.width/2, canvas.height/2);
                    ctx.arc(canvas.width/2, canvas.height/2, canvas.width/2 - 30, tempStart, tempStart + slice);
                    ctx.fillStyle = item.type === 'siga' ? '#0d1117' : item.color;
                    ctx.fill(); ctx.stroke();
                    tempStart += slice;
                });
                ctx.restore();
                if(progress < 1) requestAnimationFrame(anim);
                else { currentRotation = rot % (Math.PI*2); finishSpin(itemsSnapshot); }
            }
            requestAnimationFrame(anim);
        }

        function finishSpin(snap) {
            let target = (1.5 * Math.PI - currentRotation) % (Math.PI * 2);
            if (target < 0) target += Math.PI * 2;
            let acc = 0, winner = snap[0];
            for(let i of snap) { acc += i.prob * 2 * Math.PI; if(target <= acc) { winner = i; break; } }
            if(winner.type === 'prize') {
                wishlist.find(x => x.NumeroItem === winner.NumeroItem).Estado = 'ganado';
                confetti({ particleCount: 200, spread: 80, origin: {y: 0.6} });
                document.getElementById('modalRes').innerText = "¡LOGRADO!";
            } else { document.getElementById('modalRes').innerText = "INTENTA OTRA VEZ"; }
            document.getElementById('winnerName').innerText = winner.NombreItem;
            document.getElementById('modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
            renderUI();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('spinBtn').disabled = false;
            isSpinning = false; loadData();
        }

        lucide.createIcons();
        loadData();
    </script>
</body>
</html>
